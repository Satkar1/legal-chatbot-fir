name: CI – Build, Push & Deploy
permissions:
contents: read
packages: write
id-token: write


jobs:
build-push:
runs-on: ubuntu-latest


steps:
- name: Checkout
uses: actions/checkout@v4


- name: Set up QEMU
uses: docker/setup-qemu-action@v2


- name: Set up Docker Buildx
uses: docker/setup-buildx-action@v2


- name: Login to GitHub Container Registry
uses: docker/login-action@v2
with:
registry: ghcr.io
username: ${{ github.actor }}
password: ${{ secrets.GITHUB_TOKEN }}


- name: Build and push
uses: docker/build-push-action@v5
with:
context: .
push: true
tags: |
ghcr.io/${{ github.repository_owner }}/legal-chatbot-fir:latest
ghcr.io/${{ github.repository_owner }}/legal-chatbot-fir:${{ github.sha }}


- name: Notify Render to deploy (optional)
if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
env:
RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
run: |
echo "Triggering Render to deploy the latest image..."
curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
-H "Accept: application/json" \
-H "Content-Type: application/json" \
-H "Authorization: Bearer $RENDER_API_KEY" \
-d '{"clearCache": true}'


- name: Done
run: echo "Build & push finished"
